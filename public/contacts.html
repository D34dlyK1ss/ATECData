                    <h4><i class="fas fa-user"></i> Rodrigo Silva</h4>
                    <i class="fas fa-envelope"></i><a href="mailto:Rodrigo.Silva.T0123773@edu.atec.pt"> </a>
                    <i class="fa-brands fa-linkedin"></i><a href="https://www.linkedin.com/in/rodrigo-silva-92910b1a7"></a>
                    <i class="fa-brands fa-github"></i><a href="https://github.com/D34dlyK1ss"></a>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-sm-6">
                <div class="contact-map">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d24952.31456073992!2d-9.017665278822745!3d38.5789423387214!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd194622e5ad46d1%3A0x123b3f86b5ed915a!2sATEC%20-%20Academia%20de%20Forma%C3%A7%C3%A3o%20-%20Palmela!5e0!3m2!1spt-PT!2spt!4v1686689936529!5m2!1spt-PT!2spt"
                        frameborder="0" scrolling="no" marginheight="0" marginwidth="0"
                        style="width: 100%; height: 360px;"></iframe>
                </div>
            </div>

            <div class="col-sm-6">
                <form role="form" name="ajax-form" id="ajax-form"
                    action="https://formsubmit.io/send/coderthemes@gmail.com" method="post" class="form-main">

                    <div class="form-group">
                        <label for="name2">Name</label>
                        <input class="form-control" id="name2" name="name"
                            onblur="if(this.value == '') this.value='Name'"
                            onfocus="if(this.value == 'Name') this.value=''" type="text" value="Name">
                        <div class="error" id="err-name" style="display: none;">Please enter name</div>
                    </div>

                    <div class="form-group">
                        <label for="email2">Email</label>
                        <input class="form-control" id="email2" name="email" type="text"
                            onfocus="if(this.value == 'E-mail') this.value='';"
                            onblur="if(this.value == '') this.value='E-mail';" value="E-mail">
                        <div class="error" id="err-emailvld" style="display: none;">E-mail is not a valid format</div>
                    </div>

                    <div class="form-group">
                        <label for="message2">Message</label>
                        <textarea class="form-control" id="message2" name="message" rows="5"
                            onblur="if(this.value == '') this.value='Message'"
                            onfocus="if(this.value == 'Message') this.value=''">Message</textarea>

                        <div class="error" id="err-message" style="display: none;">Please enter message</div>
                    </div>

                    <div class="row">
                        <div class="col-xs-12">
                            <!-- <div id="ajaxsuccess" class="text-success">E-mail was successfully sent.</div>
                            <div class="error" id="err-form" style="display: none;">There was a problem validating the
                                form please check!</div>
                            <div class="error" id="err-timedout">The connection to the server timed out!</div> 
                            <div class="error" id="err-state"></div> -->
                            <button type="submit" class="btn btn-primary btn-shadow btn-rounded w-md mt-4"
                                id="send">Submit</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
