<body>
	<!--Campos para inserir informação-->
	<div id="inputs" class="container">
		<div class="row g-2" style="margin-left: 4%; margin-top: 4%;">
			<div class="col-sm">
				<div class="form-outline">
					<label class="form-label">Serial</label>
					<input type="text" id="inputSerial" placeholder="Serial" style="text-transform:uppercase" class="form-control"/>
				</div>
			</div>
			<div class="col-sm">
				<div class="form-outline">
					<label class="form-label">Price</label>
					<input type="number" id="inputPrice" placeholder="Number" step="0.01" min="0" value="0" class="form-control"/>
				</div>
			</div>
			<div class="col-sm">
				<div class="form-outline">
					<label class="form-label">Category</label>
						<select name="Category" id="inputCategory" class="form-control">
							<option value="-Select Category-">-Select Category-</option>
							<option value="Cases">Cases</option>
							<option value="Coolers">Coolers</option>
							<option value="Graphics Cards">Graphics Cards</option>
							<option value="Memory">Memory</option>
							<option value="Power Supplies">Power Supplies</option>
							<option value="Processors">Processors</option>
							<option value="Storage">Storage</option>
						</select>
				</div>
			</div>
			<div class="col-sm">
				<div class="form-outline">
					<label class="form-label">Manufacturer</label>
					<select name="Manufacturer" id="inputManufacturer" class="form-control">
						<option value="-Select Manufacturer-">-Select Manufacturer-</option>
						<option value="Acer">Acer</option>
						<option value="AMD">AMD</option>
						<option value="ASRock">ASRock</option>
						<option value="Asus">Asus</option>
						<option value="be quiet!">be quiet!</option>
						<option value="Cooler Master">Cooler Master</option>
						<option value="Corsair">Corsair</option>
						<option value="Crucial">Crucial</option>
						<option value="Deepcool">Deepcool</option>
						<option value="EVGA">EVGA</option>
						<option value="Fractal Design">Fractal Design</option>
						<option value="G.Skill">G.Skill</option>
						<option value="Gigabyte">Gigabyte</option>
						<option value="Intel">Intel</option>
						<option value="Kingston">Kingston</option>
						<option value="KIOXIA">KIOXIA</option>
						<option value="Lian Li">Lian Li</option>
						<option value="Noctua">Noctua</option>
						<option value="NVIDIA">NVIDIA</option>
						<option value="NZXT">NZXT</option>
						<option value="Samsung">Samsung</option>
						<option value="Sapphire">Sapphire</option>
						<option value="Seagate">Seagate</option>
						<option value="SeaSonic">SeaSonic</option>
						<option value="Thermaltake">Thermaltake</option>
						<option value="Western Digital">Western Digital</option>
						<option value="XFX">XFX</option>
						<option value="Zotac">Zotac</option>
					</select>
				</div>
			</div>
			<div class="col-sm">
				<div class="form-outline">
					<label class="form-label">Model</label>
					<input type="text" id="inputModel" placeholder="Model" class="form-control" />
				</div>
			</div>
			<div class="col-sm">
				<div class="form-outline">
					<label class="form-label">Color</label>
					<select name="Color" id="inputColor" class="form-control">
						<option value="None">None</option>
						<option value="Beige">Beige</option>
						<option value="Black">Black</option>
						<option value="Blue">Blue</option>
						<option value="Camo">Camo</option>
						<option value="Gold">Gold</option>
						<option value="Grey">Grey</option>
						<option value="Green">Green</option>
						<option value="Orange">Orange</option>
						<option value="Purple">Purple</option>
						<option value="Red">Red</option>
						<option value="Silver">Silver</option>
						<option value="Yellow">Yellow</option>
						<option value="White">White</option>
					</select>
				</div>
			</div>
			<div class="col-sm">
				<div class="form-outline">
					<label class="form-label">Photo</label>
					<input type="url" id="inputPhoto" placeholder="URL" class="form-control" />
				</div>
			</div>
			<div class="col-sm">
				<div class="form-outline">
					<label class="form-label">Stock</label>
					<input type="number" placeholder="Number" step="1" min="0" id="inputStock" value="0" class="form-control" />
				</div>
			</div>
		</div>
		<button type="button" onclick="clickAddComponent()" class="btn btn-primary" id="submit"
			style="margin-left: 2%; float: right; margin-top: 1%;">+ Add</button>
	</div>
	<br>
	<!--Tabela-->
	<table class="componentTable">
		<thead>
			<tr>
				<th scope="col">#</th>
				<th scope="col">Serial</th>
				<th scope="col">Price</th>
				<th scope="col">Category</th>
				<th scope="col">Manufacturer</th>
				<th scope="col">Model</th>
				<th scope="col">Color</th>
				<th scope="col">Photo</th>
				<th scope="col">Stock</th>
			</tr>
		</thead>
		<tbody id="tb"></tbody>
	</table>
</body>
